            var strDate;

    <!-- MIDI playback uses WebAudio TinySynth (Apache-2.0), see js/webaudio-tinysynth.LICENSE -->
    <script src="js/webaudio-tinysynth.min.js"></script>
    <script>
            (function () {
                // Tracks committed under music/. Used when the folder listing
                // cannot be read, including file:// pages in Firefox.
                var FALLBACK_TRACKS = [
                    "music/metallica_-_master_of_puppets.mid",
                    "music/opus_no_1_cisco_hold_music.mid",
                    "music/opus_no_1_cisco_hold_music.mp3",
                    "music/slayer_-_raining_blood.mid"
                ];

                var tracks = [];
                var selected = -1;
                var playing = false;
                var playToken = 0;
                var synth = null;
                var midiTimer = null;
                var audio = new Audio();
                audio.preload = "auto";
                audio.volume = 0.85;

                var listEl = document.getElementById("track-list");
                var startBtn = document.getElementById("music-start");
                var stopBtn = document.getElementById("music-stop");
                var syncingSelect = false;

                function titleFromPath(src) {
                    var base = src.split("/").pop().replace(/\.(mp3|mid|midi)$/i, "");
                    var spaced = base.replace(/_+/g, " ").replace(/\s+/g, " ").trim();
                    return spaced.replace(/\b\w/g, function (ch) {
                        return ch.toUpperCase();
                    });
                }

                function kindFromPath(src) {
                    return /\.mp3$/i.test(src) ? "mp3" : "midi";
                }

                function setStatus(text) {
                }

                function optionLabel(track) {
                    return track.title + " (" + (track.kind === "mp3" ? "MP3" : "MIDI") + ")";
                }

                function renderList() {
                    listEl.innerHTML = "";
                    tracks.forEach(function (track, i) {
                        var option = document.createElement("option");
                        option.value = String(i);
                        option.textContent = optionLabel(track);
                        listEl.appendChild(option);
                    });
                    if (selected >= 0 && selected < tracks.length) listEl.selectedIndex = selected;
                }

                function highlight() {
                    if (selected < 0 || selected >= listEl.options.length) return;
                    if (listEl.selectedIndex === selected) return;
                    syncingSelect = true;
                    listEl.selectedIndex = selected;
                    listEl.dispatchEvent(new Event("change", { bubbles: true }));
                    syncingSelect = false;
                }

                function haltSounds() {
                    if (midiTimer) {
                        clearInterval(midiTimer);
                        midiTimer = null;
                    }
                    audio.pause();
                    audio.removeAttribute("src");
                    audio.load();
                    if (synth) synth.stopMIDI();
                }

                function ensureSynth() {
                    if (!synth) {
                        synth = new WebAudioTinySynth({ voices: 64, useReverb: 1, quality: 1 });
                        synth.setMasterVol(0.45);
                        synth.setLoop(0);
                    }
                    return synth;
                }

                function randomIndex(except) {
                    if (!tracks.length) return -1;
                    if (tracks.length === 1) return 0;
                    var next = except;
                    while (next === except) {
                        next = Math.floor(Math.random() * tracks.length);
                    }
                    return next;
                }

                function failureText(err, title) {
                    if (err && err.name === "NotAllowedError") return "Click Start to play.";
                    if (location.protocol === "file:") return "Open this page through a web server to play music.";
                    return "Could not play " + title + ".";
                }

                function advance() {
                    if (!playing) return;
                    var next = randomIndex(selected);
                    if (next < 0) return;
                    startTrack(next);
                }

                audio.addEventListener("ended", advance);

                function watchMidi(token, player) {
                    midiTimer = setInterval(function () {
                        if (token !== playToken) return;
                        var status = player.getPlayStatus();
                        if (!status.play && status.maxTick > 0 && status.curTick >= status.maxTick) {
                            clearInterval(midiTimer);
                            midiTimer = null;
                            advance();
                        }
                    }, 250);
                }

                function startTrack(index) {
                    if (index < 0 || index >= tracks.length) return;
                    var token = ++playToken;
                    haltSounds();
                    selected = index;
                    playing = true;
                    highlight();
                    var track = tracks[index];

                    if (track.kind === "mp3") {
                        audio.src = track.src;
                        var played = audio.play();
                        if (played && played.then) {
                            played.catch(function (err) {
                                if (token !== playToken) return;
                                playing = false;
                                haltSounds();
                                setStatus(failureText(err, track.title));
                            });
                        }
                        return;
                    }

                    // Firefox blocks fetch() between file:// URLs, so MIDI bytes
                    // cannot be read when the page is opened directly.
                    if (location.protocol === "file:") {
                        playing = false;
                        setStatus(failureText(null, track.title));
                        return;
                    }

                    fetch(track.src)
                        .then(function (res) {
                            if (!res.ok) throw new Error("load");
                            return res.arrayBuffer();
                        })
                        .then(function (buf) {
                            if (token !== playToken) return;
                            var bytes = new Uint8Array(buf);
                            if (bytes.length < 4 || String.fromCharCode(bytes[0], bytes[1], bytes[2], bytes[3]) !== "MThd") {
                                throw new Error("midi");
                            }
                            var player = ensureSynth();
                            var ctx = player.getAudioContext();
                            var resume = ctx.state === "suspended" ? ctx.resume() : Promise.resolve();
                            return resume.then(function () {
                                if (token !== playToken) return;
                                if (ctx.state === "suspended") {
                                    var blocked = new Error("autoplay");
                                    blocked.name = "NotAllowedError";
                                    throw blocked;
                                }
                                player.setLoop(0);
                                player.loadMIDI(buf);
                                if (!player.getPlayStatus().maxTick) throw new Error("midi");
                                player.playMIDI();
                                watchMidi(token, player);
                            });
                        })
                        .catch(function (err) {
                            if (token !== playToken) return;
                            playing = false;
                            haltSounds();
                            setStatus(failureText(err, track.title));
                        });
                }

                function stopMusic() {
                    playToken++;
                    playing = false;
                    haltSounds();
                    if (selected >= 0 && tracks[selected]) setStatus("Stopped");
                }

                function tracksFromPaths(paths) {
                    var seen = {};
                    var out = [];
                    paths.forEach(function (src) {
                        if (seen[src]) return;
                        seen[src] = true;
                        out.push({
                            src: src,
                            title: titleFromPath(src),
                            kind: kindFromPath(src)
                        });
                    });
                    out.sort(function (a, b) {
                        return a.title.localeCompare(b.title);
                    });
                    return out;
                }

                function normalizeHref(href) {
                    href = href.split("#")[0].split("?")[0];
                    try {
                        href = decodeURIComponent(href);
                    } catch (e) { }
                    if (/^(https?:)?\/\//i.test(href) || href.indexOf("..") !== -1) return null;
                    var parts = href.split("/").filter(Boolean);
                    var name = parts[parts.length - 1];
                    if (!name || !/\.(mp3|mid|midi)$/i.test(name)) return null;
                    return "music/" + name;
                }

                function discoverTracks() {
                    if (location.protocol === "file:") return Promise.resolve(null);
                    return fetch("music/").then(function (res) {
                        if (!res.ok) return null;
                        var type = res.headers.get("content-type") || "";
                        if (type.indexOf("html") === -1 && type.indexOf("text") === -1 && type !== "") return null;
                        return res.text();
                    }).then(function (html) {
                        if (!html) return null;
                        var found = [];
                        var re = /href\s*=\s*["']([^"']+)["']/gi;
                        var match;
                        while ((match = re.exec(html))) {
                            var src = normalizeHref(match[1]);
                            if (src) found.push(src);
                        }
                        return found.length ? found : null;
                    }).catch(function () {
                        return null;
                    });
                }

                startBtn.addEventListener("click", function () {
                    if (!tracks.length) return;
                    startTrack(selected >= 0 ? selected : randomIndex(-1));
                });

                stopBtn.addEventListener("click", stopMusic);

                listEl.addEventListener("change", function () {
                    if (syncingSelect) return;
                    startTrack(Number(listEl.value));
                });

                discoverTracks().then(function (found) {
                    var paths = FALLBACK_TRACKS.slice();
                    if (found) paths = paths.concat(found);
                    tracks = tracksFromPaths(paths);
                    if (!tracks.length) {
                        setStatus("No music files found.");
                        return;
                    }
                    renderList();
                    var startAt = randomIndex(-1);
                    if (location.protocol === "file:") {
                        var mp3s = [];
                        tracks.forEach(function (track, i) {
                            if (track.kind === "mp3") mp3s.push(i);
                        });
                        startAt = mp3s.length ? mp3s[Math.floor(Math.random() * mp3s.length)] : -1;
                    }
                    if (startAt >= 0) startTrack(startAt);
                });
            })();
    </script>
    <script>
        (function () {
            // Zip files committed under games/. Used when the folder listing
            // cannot be read, including file:// pages in Firefox.
            var FALLBACK_GAMES = [
                "armegatron.zip",
                "bitfighter.zip",
                "bzflag.zip",
                "teeworlds.zip",
                "test.zip"
            ];
            var FALLBACK_GAME_SIZES = {
                "armegatron.zip": 3409370,
                "bitfighter.zip": 10914742,
                "bzflag.zip": 24139949,
                "teeworlds.zip": 9998187,
                "test.zip": 248
            };

            var listEl = document.getElementById("game-downloads");

            function titleFromName(name) {
                var base = name.replace(/\.zip$/i, "");
                var spaced = base.replace(/_+/g, " ").replace(/-+/g, " ").replace(/\s+/g, " ").trim();
                return spaced.replace(/\b\w/g, function (ch) {
                    return ch.toUpperCase();
                });
            }

            function formatSize(bytes) {
                if (bytes < 1024) return bytes + " B";
                if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
                if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + " MB";
                return (bytes / (1024 * 1024 * 1024)).toFixed(2) + " GB";
            }

            function sizeFromHeaders(headers) {
                var len = headers.get("Content-Length");
                if (len && /^\d+$/.test(len)) return Number(len);
                var range = headers.get("Content-Range") || "";
                var match = /\/(\d+)\s*$/.exec(range);
                return match ? Number(match[1]) : null;
            }

            function cancelBody(res) {
                if (res.body && res.body.cancel) res.body.cancel();
            }

            function probeSize(name) {
                var url = "games/" + encodeURIComponent(name);
                return fetch(url, { method: "HEAD" }).then(function (res) {
                    if (!res.ok) return { missing: true };
                    var size = sizeFromHeaders(res.headers);
                    if (size != null) return { size: size };
                    return fetch(url, { headers: { Range: "bytes=0-0" } }).then(function (ranged) {
                        var rangedSize = ranged.status === 206 ? sizeFromHeaders(ranged.headers) : null;
                        cancelBody(ranged);
                        return { size: rangedSize };
                    });
                }).catch(function () {
                    return { missing: true };
                });
            }

            function zipNameFromHref(href) {
                href = href.split("#")[0].split("?")[0];
                try {
                    href = decodeURIComponent(href);
                } catch (e) { }
                if (/^(https?:)?\/\//i.test(href) || href.indexOf("..") !== -1) return null;
                var parts = href.split("/").filter(Boolean);
                var name = parts[parts.length - 1];
                if (!name || !/\.zip$/i.test(name)) return null;
                return name;
            }

            function discoverGames() {
                if (location.protocol === "file:") return Promise.resolve(null);
                return fetch("games/").then(function (res) {
                    if (!res.ok) return null;
                    var type = res.headers.get("content-type") || "";
                    if (type.indexOf("html") === -1 && type.indexOf("text") === -1 && type !== "") return null;
                    return res.text();
                }).then(function (html) {
                    if (!html) return null;
                    var found = [];
                    var seen = {};
                    var re = /href\s*=\s*["']([^"']+)["']/gi;
                    var match;
                    while ((match = re.exec(html))) {
                        var name = zipNameFromHref(match[1]);
                        if (!name || seen[name]) continue;
                        seen[name] = true;
                        found.push(name);
                    }
                    return found.length ? found : null;
                }).catch(function () {
                    return null;
                });
            }

            function renderGames(games) {
                listEl.innerHTML = "";
                if (!games.length) {
                    var empty = document.createElement("li");
                    empty.textContent = "No games found.";
                    listEl.appendChild(empty);
                    return;
                }
                games.forEach(function (game) {
                    var li = document.createElement("li");
                    var img = document.createElement("img");
                    img.src = "images/skull.gif";
                    img.alt = "";
                    var link = document.createElement("a");
                    link.href = "games/" + encodeURIComponent(game.name);
                    link.setAttribute("download", game.name);
                    link.textContent = game.title;
                    var size = document.createElement("span");
                    size.className = "game-size";
                    size.textContent = game.size == null ? "Size unknown" : formatSize(game.size);
                    li.appendChild(img);
                    li.appendChild(link);
                    li.appendChild(size);
                    listEl.appendChild(li);
                });
            }

            function gamesFromNames(names, sizes) {
                return names.map(function (name) {
                    var known = sizes && Object.prototype.hasOwnProperty.call(sizes, name) ? sizes[name] : null;
                    return {
                        name: name,
                        title: titleFromName(name),
                        size: known
                    };
                });
            }

            var gamesReady = location.protocol === "file:"
                ? Promise.resolve(gamesFromNames(FALLBACK_GAMES, FALLBACK_GAME_SIZES))
                : discoverGames().then(function (found) {
                    var names = found || FALLBACK_GAMES.slice();
                    return Promise.all(names.map(function (name) {
                        return probeSize(name).then(function (probe) {
                            if (probe.missing) return null;
                            return {
                                name: name,
                                title: titleFromName(name),
                                size: probe.size != null ? probe.size : (FALLBACK_GAME_SIZES[name] || null)
                            };
                        });
                    }));
                });

            gamesReady.then(function (games) {
                games = games.filter(Boolean);
                games.sort(function (a, b) {
                    return a.title.localeCompare(b.title);
                });
                renderGames(games);
            }).catch(function () {
                renderGames([]);
            });
        })();
    </script>
